name: Test

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Let uv use Python 3.14 from setup-python instead of 3.11 from the .python-version file:
      - name: Use Python from setup-python in uv
        run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run linting tests with ruff
        run: uv run ruff check src test

      - name: Run tests with mypy
        run: uv run mypy src --ignore-missing-imports --strict

      - name: Run tests with pytest
        run: uv run pytest --numprocesses auto -vv -rA
